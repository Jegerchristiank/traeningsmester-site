<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b9d8ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b9d8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#254f83" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <circle cx="915" cy="328" r="320" fill="url(#glow)"/>

  <image href="tm-logo.png" x="55" y="42" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="120" y="76" fill="#081326" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Træningsmester</text>

  <text x="66" y="213" fill="#081326" font-family="Arial, Helvetica, sans-serif" font-size="71" font-weight="800" letter-spacing="-3">
    <tspan x="66" dy="0">Træning med</tspan>
    <tspan x="66" dy="78">retning. Uden støj.</tspan>
  </text>
  <text x="70" y="420" fill="#536074" font-family="Arial, Helvetica, sans-serif" font-size="25">
    <tspan x="70" dy="0">Program før træningen. Rolig logning undervejs.</tspan>
    <tspan x="70" dy="39">Historik, cardio og progression samlet bagefter.</tspan>
  </text>

  <g transform="translate(70 527)">
    <rect width="252" height="58" rx="29" fill="#0047ab" filter="url(#shadow)"/>
    <text x="28" y="38" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Skriv dig på ventelisten</text>
  </g>
  <circle cx="344" cy="556" r="6" fill="#e31836"/>

  <g transform="translate(650 38) scale(0.505)">
    <image href="../animation/bear-hat-poster.png" width="1080" height="1080"/>
  </g>
</svg>
