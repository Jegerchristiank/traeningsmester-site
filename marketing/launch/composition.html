<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Træningsmester — Træn videre fra sidste gang.</title>
  <style>
    @font-face { font-family: Cabinet; src: url('../../public/fonts/CabinetGrotesk-800.woff2'); font-weight: 800 }
    @font-face { font-family: Satoshi; src: url('../../public/fonts/Satoshi-500.woff2'); font-weight: 500 }
    @font-face { font-family: Satoshi; src: url('../../public/fonts/Satoshi-700.woff2'); font-weight: 700 }
    :root { --paper:#f8f7f2; --ink:#111d3a; --muted:#505768; --rule:#bec0c6; --lavender:#d8d8ee; --blue:#0759c7 }
    * { box-sizing:border-box }
    body { margin:0; color:var(--ink); background:var(--paper); font:500 36px/1.2 Satoshi,Arial,sans-serif }
    h1,p,figure,dl,dt,dd { margin:0 }
    #canvas { position:relative; isolation:isolate; width:1080px; height:1920px; overflow:hidden; background:var(--paper) }
    #canvas.outro,#canvas.still,#canvas.og { background:linear-gradient(114deg,#f2f2fb 0%,#e3e5f8 46%,#c3c9ee 100%) }
    .brand { position:absolute; left:67px; top:82px; display:flex; align-items:center; gap:15px; z-index:3 }
    .brand img { width:56px; height:56px; object-fit:contain }
    .brand span { font:800 43px/.95 Cabinet,Arial,sans-serif; letter-spacing:-.047em }
    h1 { position:absolute; left:60px; top:200px; z-index:2; font:800 146px/.87 Cabinet,Arial,sans-serif; letter-spacing:-.06em }
    h1 span { display:block; white-space:nowrap }
    .card { position:absolute; width:700px; height:auto; filter:drop-shadow(6px 16px 12px rgb(33 40 86 / 20%)) }
    .field,.moving-motif { position:absolute }
    .field { background:var(--lavender) }
    .moving-motif { display:block; object-fit:fill }
    .screen { display:block; position:absolute; z-index:1; height:auto; filter:drop-shadow(0 7px 12px rgb(18 29 63 / 12%)) }
    .note { position:absolute; left:69px; bottom:62px; font-size:26px; color:var(--muted) }
    .metric { position:absolute; left:70px; right:70px; border-top:2px solid var(--rule); padding-top:23px }
    .metric dt,.figures dt { color:var(--muted); font:700 31px/1.1 Satoshi,Arial,sans-serif; letter-spacing:-.015em }
    .metric dd,.figures dd { margin-top:11px; font:800 85px/.93 Cabinet,Arial,sans-serif; letter-spacing:-.055em; font-variant-numeric:tabular-nums; white-space:nowrap }
    .figures { position:absolute; z-index:2 }
    .figures dt:not(:first-child) { margin-top:36px }
    .figures dd:last-child { color:var(--blue) }
    .figures dd small { font:700 .46em/1 Satoshi,Arial,sans-serif; letter-spacing:-.045em }
    .cta { position:absolute; display:flex; align-items:center; gap:22px; color:var(--blue); font:700 49px/1.1 Satoshi,Arial,sans-serif; letter-spacing:-.045em }
    .arrow { width:.65em; height:.65em; flex-shrink:0 }
    .address,.status { position:absolute }
    .address { font-weight:700; letter-spacing:-.025em }
    .status { color:var(--muted) }
    .intro h1 { top:203px; font-size:151px }
    .intro .moving-motif { top:550px; left:0; width:1080px; height:1000px }
    .intro .metric { top:1603px; border:0; padding:0 }
    .intro .metric dd { font-size:96px }
    .chapter h1 { top:211px; font-size:130px }
    .chapter .field { top:532px; left:347px; right:0; height:775px }
    .chapter .card { top:184px; left:704px; width:308px; transform:rotate(3deg) }
    .chapter .screen { top:531px; left:75px; width:838px }
    .chapter .metric { bottom:151px }
    .set .field { left:0; right:0; top:780px; height:385px; background:#e7e8f3 }
    .set .screen { left:81px; top:512px; width:910px }
    .set .metric dd { color:var(--blue) }
    .rest .brand { color:#fff; text-shadow:0 1px 2px rgb(4 18 37 / 50%); top:65px }
    .rest .moving-motif { left:0; top:0; width:1080px; height:960px }
    .rest h1 { top:1032px; font-size:108px }
    .rest .screen { top:1194px; left:71px; width:938px; height:584px; object-fit:cover; object-position:50% 82% }
    .rest .note { bottom:61px }
    .history .screen { left:103px; top:548px; width:877px }
    .history .field { top:706px; width:1080px; left:0; height:441px; background:#e7e8f3 }
    .history .metric dd { color:var(--blue) }
    .outro h1 { top:220px; font-size:146px }
    .outro .field { left:70px; top:1350px; width:940px; height:2px; background:#a6adc7 }
    .outro .card { width:695px; top:635px; left:381px }
    .outro .figures { top:790px; left:65px }
    .outro .figures dd { font-size:97px }
    .outro .cta { top:1434px; left:69px; font-size:71px }
    .outro .address { top:1553px; left:70px; font-size:44px }
    .outro .status { top:1647px; left:70px; font-size:34px }
    #canvas.still { height:1350px }
    .still .brand { top:58px }
    .still h1 { top:173px; font-size:139px }
    .still .field { top:1091px; left:69px; width:942px; height:2px; background:#a6adc7 }
    .still .card { width:704px; top:473px; left:364px }
    .still .figures { top:639px; left:65px }
    .still .figures dd { font-size:95px }
    .still .cta { left:69px; top:1150px; font-size:49px }
    .still .address { top:1170px; right:69px; font-size:32px }
    .still .note { top:1256px; bottom:auto; font-size:25px }
    #canvas.og { width:1200px; height:630px }
    .og .brand { top:47px; left:46px; gap:12px }
    .og .brand img { width:44px; height:44px }
    .og .brand span { font-size:34px }
    .og h1 { top:163px; left:42px; font-size:90px }
    .og .field { top:490px; left:49px; width:485px; height:1px; background:#a6adc7 }
    .og .card { width:630px; top:41px; right:-1px }
    .og .figures { left:49px; top:359px; display:grid; grid-template-columns:auto auto; column-gap:45px }
    .og .figures dt { grid-row:1; font-size:19px }
    .og .figures dt:not(:first-child) { margin:0 }
    .og .figures dd { grid-row:2; font-size:52px; margin-top:3px }
    .og .cta { left:49px; top:524px; font-size:34px; gap:16px }
    .og .note { top:578px; left:50px; bottom:auto; font-size:18px }
  </style>
</head>
<body>
  <main id="canvas"></main>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'intro';
    const stage = document.getElementById('canvas');
    const brand = '<div class="brand"><img src="../../public/brand/tm-logo-256.webp" alt=""><span>Træningsmester</span></div>';
    const card = '<img class="card" src="../../public/product/programkort.webp" alt="Illustreret øvelseskort med ring og teksten Bænkpres med stang">';
    const field = '<div class="field"></div>';
    const figures = '<dl class="figures"><dt>Sidste træning</dt><dd>60 <small>kg × 8</small></dd><dt>Dagens første sæt</dt><dd>62,5 <small>kg × 8</small></dd></dl>';
    const arrow = '<svg class="arrow" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M4 24 24 4M5 4h19v19" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const cta = '<p class="cta">Få besked om adgang' + arrow + '</p>';
    const headline = (...lines) => '<h1>' + lines.map(line => '<span>' + line + '</span>').join('') + '</h1>';
    const metric = (label,value) => '<dl class="metric"><dt>' + label + '</dt><dd>' + value + '</dd></dl>';
    const note = label => '<p class="note">' + label + '</p>';
    const recordNote = note('Eksempeldata · rekonstruerede appvisninger');
    const product = (frame,alt) => '<img class="screen" src="../../public/product/revision-' + frame + '.webp" alt="' + alt + '">';
    const film = (name,label) => '<video class="moving-motif" muted playsinline preload="auto" aria-label="' + label + '" src="source/' + name + '-bevaegelse.mp4"></video>';
    const scenes = {
      program: {
        title:['Dit program', 'er klar.'], background:field + card, alt:'Mit styrkeprogram. Overkrop A. Bænkpres Med Stang.',
        label:'Overkrop A · Bænkpres med stang', value:'3 sæt × 8'
      },
      set: {
        title:['Registrér', 'sættet.'], background:field, alt:'Sidste sæt 60 kg × 8. Første sæt står til 62,5 kg × 8.',
        label:'Første arbejdssæt', value:'62,5 kg × 8'
      },
      history: {
        title:['Tag det med', 'til næste gang.'], background:field, alt:'Tidligere sæt i Bænkpres Med Stang den 15. november, 62,5 kg × 8.',
        label:'15. november · seneste registrering', value:'62,5 kg × 8'
      }
    };
    stage.className = mode;
    const scene = scenes[mode];
    if (scene) {
      stage.classList.add('chapter');
      stage.innerHTML = scene.background + brand + headline(...scene.title) + product(mode,scene.alt)
        + metric(scene.label,scene.value) + recordNote;
    } else if (mode === 'rest') {
      stage.innerHTML = film('timeglas','Timeglas af blå vægtskiver') + brand + headline('Hold styr på pausen.')
        + product('rest','Første sæt er registreret. Andet sæt er aktivt. Der er 01:42 tilbage af pausen.') + recordNote;
    } else if (mode === 'intro') {
      stage.innerHTML = brand + headline('Hvad løftede', 'jeg sidst?') + film('programkort','Ringbundne kort med bænkpres')
        + metric('Sidste sæt i bænkpres','60 kg × 8') + note('Eksempeldata');
    } else if (['outro','still','og'].includes(mode)) {
      stage.innerHTML = field + card + brand + headline('Træn videre', 'fra sidste gang.') + figures + cta + note('Eksempeldata');
      if (mode !== 'og') stage.insertAdjacentHTML('beforeend','<p class="address">traeningsmester.dk</p>');
      if (mode === 'outro') stage.insertAdjacentHTML('beforeend','<p class="status">Træningsmester er under udvikling.</p>');
    }
  </script>
</body>
</html>
